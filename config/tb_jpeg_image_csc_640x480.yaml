# tb_jpeg + ta_cv_image_csc_convert_to（crop / resize / csc 合一 API）
# 默认 pipeline 仅 crop；改 pipeline 或 launch pipeline:=crop,resize,csc 即可组合算子
/**:
  ros__parameters:
    input_msg: tb_jpeg
    input_topic: /tbmem_jpeg
    output_topic: /tbmem_cv_out
    publish_zero_copy: true
    output_tb_img_profile: auto
    need_dump: false
    publish_output: true
    dump_prefix: usb_
    pipeline:
    - crop
    crop.start_x: 0
    crop.start_y: 0
    crop.crop_w: 640
    crop.crop_h: 360
    resize.start_x: 0
    resize.start_y: 0
    resize.in_width: 0
    resize.in_height: 0
    resize.out_width: 640
    resize.out_height: 360
    resize.interpolation: 1
    resize.stretch_fit: 0
    csc.dst_format: rgb_packed
    csc.csc_type: YCbCr2RGB_BT601
